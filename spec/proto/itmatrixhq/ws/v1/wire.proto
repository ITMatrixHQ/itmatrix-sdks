// itmatrixhq.ws.v1: the WebSocket schema for ITMatrixHQ API keys.
//
// An API key streams GEX books only. Each binary WebSocket message is one
// Frame carrying one GexStrikeBook (a full book) or one GexStrikeBookUpdate
// (the strikes that moved since the previous version). Control messages are
// JSON. The official ITMatrixHQ SDKs decode and apply these for you.
//
// Conventions:
//   - timestamps are epoch milliseconds UTC;
//   - strikes are integer thousandths of a dollar;
//   - GEX values are dollars of dealer hedging per $1 move in the underlying;
//   - spot is the underlying price from the ITMatrixHQ price engine.
syntax = "proto3";

package itmatrixhq.ws.v1;

message Frame {
  string symbol = 1;
  reserved 10 to 22;
  oneof payload {
    GexStrikeBook gex_strike_book = 23;
    GexStrikeBookUpdate gex_strike_book_update = 24;
  }
}

enum GexBookReason {
  GEX_BOOK_REASON_UNSPECIFIED = 0;
  GEX_BOOK_REASON_SUBSCRIBE = 1;   // first book after subscribing
  GEX_BOOK_REASON_PERIODIC = 2;    // periodic refresh of the strike set
  GEX_BOOK_REASON_RESYNC = 3;      // the client asked {op:"resync"}
  GEX_BOOK_REASON_REBUILD = 4;     // new book_id: discard state
  GEX_BOOK_REASON_RECOVERY = 5;    // updates were skipped for this subscription
}

// A full book. Replaces all client state for the symbol.
message GexStrikeBook {
  uint64 captured_at_ms = 1;
  fixed64 book_id = 2;             // book identity; any change = discard state
  uint32 version = 3;              // book version this message represents
  double spot = 4;
  double net_gex = 5;              // whole-chain total, not the sum of listed strikes
  optional double flip_point = 6;  // dollars; absent when not computable
  repeated sint64 strikes = 7;     // packed; [0] absolute thousandths, [i>0] delta; ascending
  repeated float call_gex = 8;     // packed; >= 0, aligned with strikes
  repeated float put_gex = 9;      // packed; <= 0, aligned with strikes
  fixed32 crc = 10;                // CRC-32 of the book, see below
  GexBookReason reason = 11;
}

// An update. Applies only to book_id at version - 1. The strike set is fixed
// between full books.
message GexStrikeBookUpdate {
  uint64 captured_at_ms = 1;
  fixed64 book_id = 2;
  uint32 version = 3;
  double spot = 4;
  double net_gex = 5;
  optional double flip_point = 6;
  repeated uint32 index = 7;       // packed; positions into the book's strikes, ascending
  repeated float call_gex = 8;     // packed; new values aligned with index (both sides always sent)
  repeated float put_gex = 9;
  fixed32 crc = 10;                // CRC of the book after applying
}

// The book holds the 120 strikes with the largest gross |call_gex| + |put_gex|.
// Total GEX per strike is call_gex + put_gex (compute it in float64).
//
// CRC: CRC-32/IEEE (the value zlib crc32 returns) over the strikes in
// ascending order. Each strike contributes its strike in thousandths as a
// little-endian int64, then the little-endian bits of its float32 call_gex,
// then those of its float32 put_gex.
