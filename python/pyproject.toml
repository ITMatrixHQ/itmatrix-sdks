[project]
name = "itmatrix"
version = "1.0.0"
description = "Human-friendly sync and async clients for the ITMatrixHQ API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ITMatrixHQ" }]
keywords = ["itmatrixhq", "itmatrix", "options", "gamma exposure", "gex", "market data", "api client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "anyio>=4,<5",
  "protobuf>=7.35.1,<8",
  "typing-extensions>=4.7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
stream = ["websockets>=14,<16"]

[project.urls]
Homepage = "https://itmatrixhq.com"
Source = "https://github.com/ITMatrixHQ/itmatrix-sdks"
Issues = "https://github.com/ITMatrixHQ/itmatrix-sdks/issues"
Changelog = "https://github.com/ITMatrixHQ/itmatrix-sdks/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itmatrix"]

[tool.hatch.build]
include = [
  "src/itmatrix/**/*.py",
  "src/itmatrix/py.typed",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "tests/**/*.py",
]

[tool.ruff.lint]
ignore = ["E501"]
