name: Publish Python and TypeScript
# Manual only, and dormant until trusted publishers are configured on both registries.
# Releases are published by hand with scripts/publish.py. See docs/release.md § Publishing.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          ts=$(node -p "require('./ts/packages/core/package.json').version")
          echo "tag=$tag python=$py ts=$ts"
          [ "$py" = "$tag" ] && [ "$ts" = "$tag" ]
      - run: python scripts/check.py python
      - run: python scripts/check.py ts
      - name: Stage the gated artifacts
        run: |
          mkdir release
          cp python/dist/itmatrix-${GITHUB_REF_NAME#v}-py3-none-any.whl python/dist/itmatrix-${GITHUB_REF_NAME#v}.tar.gz release/
          cp ts/itmatrixhq-core-${GITHUB_REF_NAME#v}.tgz release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - run: (cd release && sha256sum -c SHA256SUMS) && mkdir dist && mv release/*.whl release/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: (cd release && sha256sum -c SHA256SUMS) && npm publish release/itmatrixhq-core-*.tgz --access public
